openapi: 3.0.4
info:
  title: Horoscope
  description: >-
    Horoscope fetches daily horoscope readings and sign details for any of the
    twelve zodiac signs. Pass a sign name to receive today's forecast text; paid
    tiers add birthdate lookups, mood, lucky numbers, sign compatibility, and
    sign facts like the ruling planet, opposite sign, brightest star and days
    until the sign's season.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/horoscope:
    get:
      summary: Horoscope
      description: Get the horoscope of the day for a specific zodiac sign
      operationId: horoscope
      parameters:
        - name: sign
          in: query
          schema:
            type: string
          required: true
          description: The zodiac sign for which you want to get the horoscope
          example: aries
        - name: period
          in: query
          schema:
            type: string
          required: false
          description: daily (default), weekly or monthly
          example: daily
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  color: orange
                  compatibility:
                    - leo
                    - sagittarius
                  date: '2026-10-26'
                  horoscope: >-
                    Today, your natural drive and ambition are amplified, Aries.
                    You're likely to feel a surge of energy, making it an
                    excellent day to tackle challenging projects and assert your
                    leadership. Communication flows well, so don't hesitate to
                    express your ideas clearly and confidently. Be mindful,
                    however, of potential impatience; ensure you're not rushing
                    others or overlooking important details in your eagerness to
                    move forward. A surprise opportunity might arise from an
                    unexpected source, so stay open and adaptable. Financially,
                    a cautious approach is advised, but longterm investments
                    could see positive developments if you've done your due
                    diligence. Listen to your intuition, especially when making
                    significant decisions regarding your career or personal
                    goals. Your courage will be your greatest asset.
                  period: daily
                  periodStart: '2026-10-26'
                  periodEnd: '2026-10-26'
                  luckyNumber: 74
                  luckyTime: 6:00 AM
                  mood: excited
                  sign: aries
                  zodiac:
                    element: fire
                    name: Aries
                    stone: bloodstone
                    symbol: ♈
                    ruler: Mars
                    modality: cardinal
                    opposite: libra
                    brightestStar:
                      name: Hamal
                      description: The head of the Ram
                      magnitude: 2
                    season:
                      start: 03-21
                      end: 04-20
                      inSeason: false
                      daysUntil: 145
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
